<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-model-title data-model-desc" id="data-model-root">
        <title id="data-model-title">Modelo de dados do Finance Controller</title>
        <desc id="data-model-desc">Esquema físico com as tabelas User, Categories e Moviments, seus tipos de coluna, índices únicos em User.Email e Categories(UserId, Name), e as chaves estrangeiras: Categories e Moviments para User em cascata, e Moviments para Categories sem ação.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #data-model-root { --color-paper:  #f3f6fb;   
      --color-ink:    #172036;   
      --color-muted:  #4a5573;   
      --color-accent: #1d44a6;   
      --color-rule:   rgba(23,32,54,0.12);
      --font-sans:    'Public Sans', system-ui, sans-serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #data-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #data-model-root .diagram-container { width: 100%; overflow-x: auto; }
      #data-model-root .lead { color: var(--color-muted); font-size: 1rem; line-height: 1.5; max-width: 60rem; margin-bottom: 1.5rem; }
      #data-model-root .hint { display: none; font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-muted); margin-bottom: 0.5rem; }
      @media (max-width: 48rem) {
#data-model-root .hint { display: block; }
}
      @media print {
#data-model-root .diagram-container { overflow-x: visible; }
}</style>

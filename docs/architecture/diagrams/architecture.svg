<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="32 40 1216 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Arquitetura em camadas do Finance Controller</title>
        <desc id="architecture-desc">Caminho de uma requisição do navegador, pelo proxy do Render e pelo pipeline de middlewares da Finance.API, até controllers, services da Finance.Application, o FinanceContext da Finance.Infrastructure com o filtro global por usuário e o PostgreSQL no Neon, com todas as camadas dependendo de Finance.Domain.</desc>
<defs>
      <style>#architecture-root { --color-paper:  #f3f6fb;   
      --color-ink:    #172036;   
      --color-muted:  #4a5573;   
      --color-accent: #1d44a6;   
      --color-rule:   rgba(23,32,54,0.12);
      --font-sans:    'Public Sans', system-ui, sans-serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .lead { color: var(--color-muted); font-size: 1rem; line-height: 1.5; max-width: 60rem; margin-bottom: 1.5rem; }
      #architecture-root .hint { display: none; font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-muted); margin-bottom: 0.5rem; }
      @media (max-width: 1278px) {
#architecture-root .hint { display: block; }
}
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>

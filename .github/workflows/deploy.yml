name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.10

      - name: Build migrations bundle
        env:
          # design-time placeholder; the bundle does not connect while building
          ConnectionStrings__DefaultConnection: Host=localhost;Database=placeholder;Username=postgres
        run: >
          dotnet ef migrations bundle
          --project Finance.Infrastructure
          --startup-project Finance.API
          --self-contained -r linux-x64
          -o efbundle --force

      - name: Apply migrations
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: ./efbundle --connection "$DATABASE_URL_DIRECT"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null

      - name: Wait for /health
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          url="${APP_URL%/}/health"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Health check did not return 200 within 10 minutes" >&2
          exit 1

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # No `branches:` filter on purpose: it cannot reference the repository's default branch.
    # The job-level `if:` below does the filtering; when it is false the run is simply skipped.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch) ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Require APP_URL
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL is not set (GitHub variable or secret); configure it before deploying." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.10

      - name: Build migrations bundle
        env:
          # design-time placeholder; the bundle does not connect while building
          ConnectionStrings__DefaultConnection: Host=localhost;Database=placeholder;Username=postgres
        run: >
          dotnet ef migrations bundle
          --project Finance.Infrastructure
          --startup-project Finance.API
          --self-contained -r linux-x64
          -o efbundle --force

      - name: Apply migrations
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: ./efbundle --connection "$DATABASE_URL_DIRECT"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Ask Render to build exactly the commit whose migrations were just applied. The hook URL is a
          # secret: it is only ever passed to curl through a variable, never printed.
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) hook="${RENDER_DEPLOY_HOOK_URL}&ref=${RELEASE_SHA}" ;;
            *)    hook="${RENDER_DEPLOY_HOOK_URL}?ref=${RELEASE_SHA}" ;;
          esac
          curl --fail --silent --show-error -X POST "$hook" > /dev/null

      - name: Wait for the new version on /health
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          url="${APP_URL%/}/health"
          answered=0
          last_version=""
          for i in $(seq 1 40); do
            body=$(curl -s --max-time 20 "$url" || true)
            status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$status" = "ok" ]; then
              answered=1
              last_version="$version"
              # Full SHA match; a short-SHA prefix in either direction (at least 7 chars) is tolerated.
              if [ -n "$version" ] && [ "${#version}" -ge 7 ] &&
                 { [ "$version" = "$RELEASE_SHA" ] ||
                   [ "${RELEASE_SHA#"$version"}" != "$RELEASE_SHA" ] ||
                   [ "${version#"$RELEASE_SHA"}" != "$version" ]; }; then
                echo "attempt $i: /health reports the expected version ($version)"
                exit 0
              fi
              echo "attempt $i: /health ok, but version is '${version:-<none>}' (expected $RELEASE_SHA)"
            else
              echo "attempt $i: no healthy answer from /health"
            fi
            sleep 15
          done
          if [ "$answered" = "1" ]; then
            echo "The app answered /health but never reported version $RELEASE_SHA within 10 minutes (last version seen: '${last_version:-<none>}'). Render may have deployed another commit, or RENDER_GIT_COMMIT/APP_VERSION is not set; see docs/devops/DEPLOY.md." >&2
          else
            echo "No healthy answer from /health within 10 minutes." >&2
          fi
          exit 1
